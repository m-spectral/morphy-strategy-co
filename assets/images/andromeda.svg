<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Andromeda</title>
  <desc id="desc">A minimal galaxy of elliptical orbits around a luminous center.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="50%" r="75%"><stop stop-color="#12245b"/><stop offset="1" stop-color="#00072f"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#f8f7f5"/><stop offset=".38" stop-color="#9fd8f3"/><stop offset="1" stop-color="#0035f3" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00eaff" stop-opacity=".12"/><stop offset=".55" stop-color="#8ca4ff" stop-opacity=".68"/><stop offset="1" stop-color="#f36d00" stop-opacity=".2"/></linearGradient>
  </defs>
  <rect width="760" height="560" fill="url(#field)"/>
  <g fill="none" stroke="url(#orbit)" transform="rotate(-24 380 280)">
    <ellipse cx="380" cy="280" rx="300" ry="80" stroke-width="1.5"/>
    <ellipse cx="380" cy="280" rx="250" ry="62" stroke-width="1.2"/>
    <ellipse cx="380" cy="280" rx="196" ry="45" stroke-width="1.2"/>
    <ellipse cx="380" cy="280" rx="140" ry="29" stroke-width="1.4"/>
    <path d="M75 280c105-71 235-104 363-73 98 24 169 82 247 73" stroke-width="1.3"/>
  </g>
  <ellipse cx="380" cy="280" rx="78" ry="36" fill="url(#core)" transform="rotate(-24 380 280)"/>
  <circle cx="380" cy="280" r="7" fill="#f8f7f5"/>
  <circle cx="380" cy="280" r="16" fill="none" stroke="#00eaff" stroke-opacity=".5"/>
  <g fill="#dfeaff"><circle cx="147" cy="116" r="2"/><circle cx="608" cy="112" r="1.5"/><circle cx="651" cy="412" r="2"/><circle cx="142" cy="444" r="1.5"/><circle cx="511" cy="474" r="1"/><circle cx="229" cy="75" r="1"/></g>
  <circle cx="623" cy="176" r="3" fill="#f36d00"/>
</svg>
